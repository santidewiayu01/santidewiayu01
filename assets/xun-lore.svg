<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 604" width="720" height="604" role="img" aria-labelledby="t d"><title id="t">Developer lore</title><desc id="d">Developer lore. Build, break, understand, improve, set as a stepped typographic line. Build it. Break it. Understand it. Make it better. Workflow: IDEA, DESIGN, BUILD, BREAK, DEBUG, UNDERSTAND, IMPROVE, SHIP, lit one step at a time.</desc><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="44" y1="70" x2="300" y2="310"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C084FC"/></linearGradient><radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient></defs><rect width="720" height="604" fill="#07060B"/><ellipse cx="380" cy="190" rx="340" ry="190" fill="url(#gl)"/><polyline points="44,62 120,142 200,222 300,302" fill="none" stroke="url(#lg)" stroke-width="1.4"/><circle r="3.5" cx="44" cy="62" fill="#F5F3F7"><animate attributeName="cx" values="44;120;200;300;44" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="62;142;222;302;62" dur="10s" repeatCount="indefinite"/></circle><circle cx="44" cy="62" r="5" fill="#A855F7"/><circle cx="44" cy="62" r="11" fill="none" stroke="#A855F7" stroke-opacity=".3"/><text x="68" y="84" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="58" font-weight="300" textLength="210" lengthAdjust="spacing" fill="#F5F3F7">BUILD</text><circle cx="120" cy="142" r="5" fill="#A855F7"/><circle cx="120" cy="142" r="11" fill="none" stroke="#A855F7" stroke-opacity=".3"/><text x="144" y="164" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="58" font-weight="300" textLength="220" lengthAdjust="spacing" fill="#F5F3F7">BREAK</text><circle cx="200" cy="222" r="5" fill="#A855F7"/><circle cx="200" cy="222" r="11" fill="none" stroke="#A855F7" stroke-opacity=".3"/><text x="224" y="244" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="58" font-weight="300" textLength="430" lengthAdjust="spacing" fill="#F5F3F7">UNDERSTAND</text><circle cx="300" cy="302" r="5" fill="#A855F7"/><circle cx="300" cy="302" r="11" fill="none" stroke="#A855F7" stroke-opacity=".3"/><text x="324" y="324" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="58" font-weight="300" textLength="290" lengthAdjust="spacing" fill="#C084FC">IMPROVE</text><text x="44" y="376" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="20" letter-spacing="1" fill="#918A9F">Build it. Break it. Understand it. Make it better.</text><line x1="44" y1="402" x2="676" y2="402" stroke="#2A2236"/><text x="44" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="4" fill="#918A9F">WORKFLOW</text><path d="M44 478H680V522H24V566H680" fill="none" stroke="#A855F7" stroke-opacity=".4"/><circle cx="60" cy="478" r="6" fill="#1A1326" stroke="#A855F7"><animate attributeName="fill" values="#C084FC;#1A1326;#1A1326" keyTimes="0.0000;0.1250;1.0000" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><text x="54" y="462" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="17" letter-spacing="2" fill="#918A9F">IDEA<animate attributeName="fill" values="#F5F3F7;#918A9F;#918A9F" keyTimes="0.0000;0.1250;1.0000" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><circle cx="230" cy="478" r="6" fill="#1A1326" stroke="#A855F7"><animate attributeName="fill" values="#1A1326;#C084FC;#1A1326;#1A1326" keyTimes="0.0000;0.1250;0.2500;1.0000" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><text x="224" y="462" font-family="'Helvetica Neue',Helvetica,Arial,system-ui,'Segoe UI',sans-serif" font-size="17" letter-spacing="2" fill=